# Publie l'application Web sur GitHub Pages à chaque envoi sur main.
#
# Le corpus est réassemblé et validé pendant la construction : le dépôt ne
# transporte donc jamais un web/data/corpus.json désynchronisé de shared/data.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assembler et valider le corpus
        run: node tools/build-data.mjs

      - name: Rendre toutes les routes dans un DOM simulé
        run: node tools/test-web.mjs

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploiement
        uses: actions/deploy-pages@v4
